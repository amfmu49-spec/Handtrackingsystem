<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Hand Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #yt_container {
            position: absolute;
            transform-origin: 0% 50%; /* 手首支点固定 */
            transition: transform 0.05s linear, width 0.05s, height 0.05s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px; overflow: hidden; background: #000; opacity: 0;
            pointer-events: auto;
        }
        #iframe_player { width: 100%; height: 100%; border: none; }
        .glass { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="ui" class="absolute top-4 left-4 z-50 glass text-white p-4 rounded-xl hidden">
        <input type="text" id="url_input" placeholder="YouTube/TikTok URL" class="w-64 bg-black/50 p-2 rounded mb-2 block border border-white/20">
        <label class="text-xs block mb-1">サイズ調整 (0.1 - 2.0)</label>
        <input type="range" id="scale_slider" min="0.1" max="2.0" step="0.01" value="0.5" class="w-full">
        <button id="save_btn" class="mt-4 w-full bg-blue-600 py-2 rounded">適用</button>
    </div>
    <div class="absolute bottom-4 left-4 text-white text-xs z-50">タップで設定 / TikTokは動画内タップで音ON</div>
    <canvas id="output_canvas"></canvas>
    <div id="yt_container"><iframe id="iframe_player" allow="autoplay; encrypted-media"></iframe></div>

    <script>
        const canvas = document.getElementById('output_canvas'), ctx = canvas.getContext('2d');
        const container = document.getElementById('yt_container'), iframe = document.getElementById('iframe_player');
        let scaleBase = 0.5;

        canvas.addEventListener('click', () => document.getElementById('ui').classList.toggle('hidden'));
        
        document.getElementById('save_btn').addEventListener('click', async () => {
            const input = document.getElementById('url_input').value;
            scaleBase = parseFloat(document.getElementById('scale_slider').value);
            
            if (input.includes('tiktok.com')) {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(input)}`);
                const data = await res.json();
                const match = data.contents.match(/video\/(\d+)/);
                iframe.src = match ? `https://www.tiktok.com/embed/v2/${match[1]}?autoplay=1` : "";
            } else {
                const id = input.match(/(?:v=|\/)([\w-]{11})/)?.[1];
                iframe.src = id ? `https://www.youtube.com/embed/${id}?autoplay=1&mute=0` : "";
            }
            document.getElementById('ui').classList.add('hidden');
        });

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({maxNumHands: 1, minDetectionConfidence: 0.7});
        hands.onResults((res) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);
            
            if (res.multiHandLandmarks?.[0]) {
                const lm = res.multiHandLandmarks[0];
                const dx = lm[12].x - lm[0].x, dy = lm[12].y - lm[0].y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // 縦動画判定: 指先が天（-90度付近）を向いているか
                const isVertical = Math.abs(angle + 90) < 45;
                container.style.width = isVertical ? '225px' : '400px';
                container.style.height = isVertical ? '400px' : '225px';
                
                // 遠近感モード: 距離に比例してサイズ変化
                const scale = scaleBase * (dist / 0.3);
                container.style.left = `${lm[0].x * window.innerWidth}px`;
                container.style.top = `${lm[0].y * window.innerHeight}px`;
                container.style.transform = `scale(${scale}) rotate(${angle}deg)`;
                container.style.opacity = 1;
            } else {
                container.style.opacity = 0;
            }
        });

        new Camera(document.createElement('video'), { onFrame: async(img) => await hands.send({image: img}) }).start();
    </script>
</body>
</html>
