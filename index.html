<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- YouTubeの「Error 153」を防ぐための重要なセキュリティポリシー -->
    <meta name="referrer" content="origin">
    <title>AR Hand Tracker - YouTube Hologram</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        #yt_container {
            position: absolute;
            z-index: 10;
            width: 320px;
            height: 180px;
            /* 基準点を「中央」に設定 (手のひらの中心に合わせるため) */
            transform-origin: center center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            background: #000;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        /* 美しいガラスモーフィングデザイン */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        /* 入力欄のリッチ化 */
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-black overflow-hidden relative w-screen h-screen">
    
    <!-- カメラ映像 (非表示にしてCanvasに描画する) -->
    <video id="input_video" class="hidden" playsinline></video>
    <!-- AR描画用キャンバス -->
    <canvas id="output_canvas" class="absolute top-0 left-0 w-full h-full object-cover z-0"></canvas>
    
    <!-- YouTube動画コンテナ（手のひらの中央に追従） -->
    <div id="yt_container">
        <!-- Error 153対策のため、直接iframeを配置してoriginを指定 -->
        <iframe id="youtube_player" 
            src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=jfKfPfyJRdk&origin=https://google.com" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

    <!-- バージョン情報と操作ヒント -->
    <div class="absolute top-4 left-4 z-20 pointer-events-none">
        <h1 class="text-white font-bold text-2xl drop-shadow-lg tracking-wider">AR HAND TRACKER <span class="text-blue-400">v3.6.0</span></h1>
        <p class="text-gray-300 mt-2 drop-shadow-md bg-black/30 inline-block px-3 py-1 rounded-full text-sm">
            画面をタップして設定を開く
        </p>
    </div>

    <!-- 設定モーダル (初期非表示) -->
    <div id="settings_modal" class="hidden absolute top-0 left-0 w-full h-full bg-black/50 z-30 flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass rounded-3xl p-8 w-full max-w-md relative overflow-hidden">
            <!-- 装飾用の光彩 -->
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-screen filter blur-[50px] opacity-50 pointer-events-none"></div>
            <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-purple-500 rounded-full mix-blend-screen filter blur-[50px] opacity-50 pointer-events-none"></div>
            
            <h2 class="text-2xl font-bold text-white mb-6 relative z-10 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Hologram Settings
            </h2>
            
            <!-- サイズ調整スライダー -->
            <div class="mb-8 relative z-10">
                <label class="block text-xs font-medium text-gray-300 mb-3 flex justify-between tracking-widest">
                    <span>SIZE</span>
                    <!-- 初期値30% -->
                    <span id="size_value" class="text-blue-300 font-bold">30%</span>
                </label>
                <input type="range" id="size_slider" min="0.1" max="2.0" step="0.1" value="0.3" class="w-full accent-blue-500 h-2 bg-gray-700/50 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- YouTube URL入力 -->
            <div class="relative z-10 space-y-3">
                <label class="block text-xs font-medium text-gray-300 tracking-widest">YOUTUBE URL</label>
                <input type="text" id="youtube_url" placeholder="https://youtu.be/..." class="glass-input w-full px-4 py-3 rounded-xl focus:outline-none transition-all duration-300">
                <button id="update_btn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform hover:scale-105 active:scale-95">
                    UPDATE HOLOGRAM
                </button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const ytContainer = document.getElementById('yt_container');
        const iframePlayer = document.getElementById('youtube_player');
        
        const settingsModal = document.getElementById('settings_modal');
        const sizeSlider = document.getElementById('size_slider');
        const sizeValue = document.getElementById('size_value');
        const urlInput = document.getElementById('youtube_url');
        const updateBtn = document.getElementById('update_btn');

        // 初期サイズ 30%
        let currentScale = 0.3;

        // 背景のキャンバスをタップしたら設定を開く
        canvasElement.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
        });

        // モーダルの背景（外側）をタップしたら閉じる
        settingsModal.addEventListener('click', (e) => {
            // モーダルの中身（パネル）ではなく、親要素（暗い背景）がクリックされた時だけ閉じる
            if (e.target === settingsModal) {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }
        });

        // スライダーでサイズ変更
        sizeSlider.addEventListener('input', (e) => {
            currentScale = parseFloat(e.target.value);
            sizeValue.textContent = Math.round(currentScale * 100) + '%';
        });

        // URL更新ボタンの処理
        updateBtn.addEventListener('click', () => {
            const url = urlInput.value;
            let videoId = '';
            
            try {
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('youtube.com/watch')) {
                    videoId = url.split('v=')[1].split('&')[0];
                } else if (url.includes('youtube.com/shorts/')) {
                    videoId = url.split('shorts/')[1].split('?')[0];
                }
                
                if (videoId) {
                    // originを付与してError 153を回避しつつ、新しい動画を読み込む
                    const newUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=${videoId}&origin=${window.location.origin || 'https://google.com'}`;
                    iframePlayer.src = newUrl;
                    
                    settingsModal.classList.add('hidden');
                    settingsModal.classList.remove('flex');
                    urlInput.value = ''; // 入力欄をクリア
                }
            } catch (error) {
                console.error("URLの解析に失敗しました", error);
            }
        });

        // Canvasのサイズを画面に合わせる
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 認識結果の処理ループ
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // カメラ映像をCanvasに描画 (左右反転なし)
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. 手の骨格（ポインタ）を描画する
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 3});

                // 2. 手のひらの中央座標を取得（手首:0 と 中指の付け根:9 の中間点）
                const wrist = landmarks[0];
                const middleFingerBase = landmarks[9];

                // 画面上のピクセル座標に変換
                const centerX = ((wrist.x + middleFingerBase.x) / 2) * canvasElement.width;
                const centerY = ((wrist.y + middleFingerBase.y) / 2) * canvasElement.height;

                // 2Dの傾きを計算 (腕の向きに合わせて動画が回転する)
                const dx = middleFingerBase.x - wrist.x;
                const dy = middleFingerBase.y - wrist.y;
                const angleRad = Math.atan2(dy, dx);
                let angleDeg = angleRad * (180 / Math.PI);
                
                // カメラからの奥行き距離からスケールを計算
                const baseDistance = Math.sqrt(dx*dx + dy*dy);
                const depthScale = baseDistance * 10;
                const finalScale = currentScale * depthScale;

                // 3. YouTubeコンテナを手のひらの中央に配置・回転・拡縮
                ytContainer.style.opacity = 1;
                // コンテナの中心を手のひら中央に合わせる
                ytContainer.style.transform = `
                    translate(${centerX}px, ${centerY}px) 
                    translate(-50%, -50%) 
                    rotate(${angleDeg}deg) 
                    scale(${finalScale})
                `;
            } else {
                // 手が認識されない場合はホログラムを隠す
                ytContainer.style.opacity = 0;
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1, // 片手のみ認識（処理を軽くするため）
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // カメラの起動（アウトカメラを指定）
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'environment' // アウトカメラを使用
        });
        camera.start();
    </script>
</body>
</html>
