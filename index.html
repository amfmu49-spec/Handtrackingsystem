<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Hand Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .glass-modal { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #6366f1; cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }
        /* スピナーアニメーション */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #6366f1; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
    </style>
</head>
<body class="relative w-full h-screen flex justify-center items-center">

    <!-- カメラ映像表示用 (非表示にしてCanvasに描画) -->
    <video id="input_video" class="layer hidden" autoplay playsinline></video>
    <!-- AR描画用キャンバス -->
    <canvas id="output_canvas" class="layer"></canvas>

    <!-- ヘッダー情報 -->
    <div id="ui_layer" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-10">
        <div class="glass-panel text-white px-4 py-3 rounded-2xl flex flex-col pointer-events-auto">
            <h1 class="text-sm font-bold tracking-wider flex items-center gap-2">
                AR HAND TRACKER
                <span class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full shadow-lg shadow-indigo-500/30">ver.1.3.6</span>
            </h1>
            <div id="status_message" class="text-xs text-gray-300 mt-2 flex items-center gap-2 transition-opacity duration-300">
                <div id="loading_spinner" class="spinner"></div>
                <span id="status_text">AIモデルを読み込み中...</span>
            </div>
        </div>
    </div>

    <!-- 画面全体を覆う透明な設定起動ボタン -->
    <div id="settings_trigger" class="absolute inset-0 z-0 cursor-pointer"></div>

    <!-- 設定モーダル -->
    <div id="settings_modal" class="hidden absolute inset-0 bg-black/60 z-50 flex justify-center items-center backdrop-blur-sm transition-opacity duration-300">
        <div class="glass-modal text-white p-6 rounded-3xl w-11/12 max-w-sm flex flex-col gap-6 transform transition-transform duration-300 scale-95" id="settings_content">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h2 class="text-lg font-bold">AR設定</h2>
                <button id="close_modal_btn" class="text-gray-400 hover:text-white p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex flex-col gap-2">
                <label class="text-sm text-gray-300 font-semibold">1. 画像をアップロード</label>
                <label for="image_upload" class="flex items-center justify-center w-full p-4 border-2 border-dashed border-gray-600 rounded-xl hover:border-indigo-500 hover:bg-indigo-500/10 cursor-pointer transition-colors">
                    <span id="upload_label" class="text-sm text-gray-400 text-center">タップして画像を選択<br>(PNG, JPG, GIF)</span>
                    <input type="file" id="image_upload" class="hidden" accept="image/png, image/jpeg, image/gif">
                </label>
            </div>

            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm text-gray-300 font-semibold">2. 画像サイズ</label>
                    <span id="scale_val" class="text-xs text-indigo-400">100%</span>
                </div>
                <input type="range" id="scale_slider" min="0.2" max="3" step="0.1" value="1">
            </div>

            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm text-gray-300 font-semibold">3. 3D立体感（立ち上がり）</label>
                    <span id="tilt_val" class="text-xs text-indigo-400">60%</span>
                </div>
                <input type="range" id="tilt_slider" min="0" max="1" step="0.1" value="0.6">
                <p class="text-[10px] text-gray-500 leading-tight">0%で常に正面(2D)、100%で物理法則に従って完全に倒れます。</p>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const ctx = canvasElement.getContext('2d');
        const statusMessage = document.getElementById('status_message');
        const statusText = document.getElementById('status_text');
        const loadingSpinner = document.getElementById('loading_spinner');

        // UI Elements
        const settingsTrigger = document.getElementById('settings_trigger');
        const settingsModal = document.getElementById('settings_modal');
        const closeModalBtn = document.getElementById('close_modal_btn');
        const imageUpload = document.getElementById('image_upload');
        const uploadLabel = document.getElementById('upload_label');
        const scaleSlider = document.getElementById('scale_slider');
        const scaleVal = document.getElementById('scale_val');
        const tiltSlider = document.getElementById('tilt_slider');
        const tiltVal = document.getElementById('tilt_val');

        // State Variables
        let loadedImage = null;
        let customScale = 1.0;
        let customTiltAmount = 0.6; // 0=2D, 1=3D
        let isHandPresent = false;
        
        // 追従・安定化のためのステート
        let smoothedData = { x: null, y: null, angle: null, tilt: null, size: null };
        let isPalmFacing = true; // 表裏判定のヒステリシス用

        // Resize Canvas to fit screen window
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Math Helper Functions
        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }
        // 角度の滑らかな補間（360度の境界をまたぐ場合に対応）
        function lerpAngle(start, end, factor) {
            let diff = end - start;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return start + diff * factor;
        }
        
        function updateStatus(message, showSpinner = false) {
            statusText.textContent = message;
            loadingSpinner.style.display = showSpinner ? 'block' : 'none';
            statusMessage.style.opacity = '1';
        }

        // 背景タップでモーダルを開く
        settingsTrigger.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            setTimeout(() => document.getElementById('settings_content').classList.remove('scale-95'), 10);
        });

        // モーダルを閉じる処理（閉じるボタン or 背景タップ）
        function closeModal() {
            document.getElementById('settings_content').classList.add('scale-95');
            setTimeout(() => settingsModal.classList.add('hidden'), 300);
        }
        closeModalBtn.addEventListener('click', closeModal);
        settingsModal.addEventListener('click', (e) => {
            if(e.target === settingsModal) closeModal();
        });

        // 画像アップロード処理
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedImage = img;
                        uploadLabel.innerHTML = `<span class="text-indigo-400 font-bold">${file.name}</span><br>設定完了`;
                        uploadLabel.parentElement.classList.add('border-indigo-500', 'bg-indigo-500/10');
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // スライダー処理
        scaleSlider.addEventListener('input', (e) => {
            customScale = parseFloat(e.target.value);
            scaleVal.textContent = Math.round(customScale * 100) + '%';
        });
        tiltSlider.addEventListener('input', (e) => {
            customTiltAmount = parseFloat(e.target.value);
            tiltVal.textContent = Math.round(customTiltAmount * 100) + '%';
        });

        // MediaPipeの初期化（ここは絶対にモデルのURLを返すだけにする）
        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        // 追従性を上げるため modelComplexity を 0 (Fast) に設定
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0,
            minDetectionConfidence: 0.4, // 少し下げて認識しやすく
            minTrackingConfidence: 0.4
        });

        hands.onResults((results) => {
            // 背景の描画（カメラ映像）
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandPresent = true;
                statusMessage.style.opacity = '0'; // 認識したらメッセージを隠す

                const landmarks = results.multiHandLandmarks[0];
                const handedness = results.multiHandLandmarks[0]; // 簡易取得
                const isLeftHand = results.multiHandedness[0].label === 'Left';

                const p0 = landmarks[0]; // 手首
                const p5 = landmarks[5]; // 人差し指付け根
                const p9 = landmarks[9]; // 中指付け根
                const p17 = landmarks[17]; // 小指付け根

                const aspect = canvasElement.width / canvasElement.height;

                // --- 1. 3Dベクトルによる表裏判定とパース計算 ---
                // XとYはアスペクト比を補正
                const v1 = { x: p5.x - p0.x, y: (p5.y - p0.y) / aspect, z: p5.z - p0.z };
                const v2 = { x: p17.x - p0.x, y: (p17.y - p0.y) / aspect, z: p17.z - p0.z };

                // 外積 (法線ベクトル)
                let nx = (v1.y * v2.z) - (v1.z * v2.y);
                let ny = (v1.z * v2.x) - (v1.x * v2.z);
                let nz = (v1.x * v2.y) - (v1.y * v2.x);

                // 左手の場合は法線が逆になるため反転（お辞儀バグ解消）
                if (isLeftHand) {
                    nx = -nx; ny = -ny; nz = -nz;
                }

                // 手の甲・表の判定 (ヒステリシスを持たせてチカチカ防止)
                // nzが負なら表(カメラ側)、正なら裏
                if (isPalmFacing) {
                    if (nz > 0.04) isPalmFacing = false; // 裏返ったとみなす
                } else {
                    if (nz < -0.04) isPalmFacing = true; // 表に戻ったとみなす
                }

                // 表裏に応じた骨組みの色
                const skeletonColor = isPalmFacing ? '#06b6d4' : '#f59e0b'; // シアン / アンバー
                const jointColor = isPalmFacing ? '#a855f7' : '#ef4444'; // パープル / レッド

                // 骨組みの描画
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: skeletonColor, lineWidth: 3 });
                drawLandmarks(ctx, landmarks, { 
                    color: jointColor, 
                    fillColor: '#ffffff', 
                    lineWidth: 2, 
                    radius: (data) => { return [4, 8, 12, 16, 20].includes(data.index) ? 5 : 3; }
                });

                // --- 2. 画像の配置計算 (表の時のみ描画) ---
                if (isPalmFacing && loadedImage) {
                    const midX = p9.x * canvasElement.width;
                    const midY = p9.y * canvasElement.height;
                    const wristX = p0.x * canvasElement.width;
                    const wristY = p0.y * canvasElement.height;

                    // サイズ計算: Z座標(奥行き)も含めた3D距離で計算。手が水平になっても小さくならない。
                    const dx3d = (p9.x - p0.x) * canvasElement.width;
                    const dy3d = (p9.y - p0.y) * canvasElement.height;
                    const dz3d = (p9.z - p0.z) * canvasElement.width;
                    const rawSize = Math.hypot(dx3d, dy3d, dz3d) * 1.8;

                    // 角度の計算: "常に2D上での手首から中指の方向" に固定。(チカチカ・回転ブレの完全撲滅)
                    const targetAngle = Math.atan2(p9.y - p0.y, (p9.x - p0.x) * aspect) + Math.PI / 2;

                    // 傾き(パース)の計算: Z軸からの倒れ具合。水平になるほど潰れる。
                    const normalLength = Math.hypot(nx, ny, nz);
                    const normalLength2D = Math.hypot(nx, ny);
                    const physicalTilt = normalLength2D / (normalLength || 1);
                    const rawTilt = Math.max(0.1, physicalTilt); // 完全に潰れるのを防止

                    // スライダーによるブレンド (0=2D, 1=3D)
                    const targetTilt = lerp(1.0, rawTilt, customTiltAmount);

                    // 平滑化(スムージング)処理。位置は早く、角度と傾きはじわっと追従させる。
                    if (smoothedData.x === null) {
                        smoothedData = { x: midX, y: midY, angle: targetAngle, tilt: targetTilt, size: rawSize };
                    } else {
                        smoothedData.x = lerp(smoothedData.x, midX, 0.7);
                        smoothedData.y = lerp(smoothedData.y, midY, 0.7);
                        smoothedData.size = lerp(smoothedData.size, rawSize, 0.4);
                        smoothedData.tilt = lerp(smoothedData.tilt, targetTilt, 0.2); // 傾きはゆっくり
                        smoothedData.angle = lerpAngle(smoothedData.angle, targetAngle, 0.3); // 角度もゆっくり
                    }

                    // --- 3. 画像と影の描画 ---
                    ctx.save();
                    // 中指の付け根を中心に移動
                    ctx.translate(smoothedData.x, smoothedData.y);
                    // 回転(中指方向)
                    ctx.rotate(smoothedData.angle);

                    // 影の描画 (接地面を演出)
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, smoothedData.size * 0.4 * customScale, smoothedData.size * 0.15 * customScale, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Y軸方向へのパース(圧縮)を適用
                    ctx.scale(1, smoothedData.tilt);

                    // 画像サイズの計算と描画
                    const imgWidth = smoothedData.size * customScale;
                    const imgHeight = (loadedImage.height / loadedImage.width) * imgWidth;
                    
                    // 画像の「底辺の中央」が原点(0,0)にくるようにオフセットして描画
                    ctx.drawImage(loadedImage, -imgWidth / 2, -imgHeight, imgWidth, imgHeight);

                    ctx.restore();
                } else if (!isPalmFacing) {
                    // 手が裏返った時は位置データをリセットして、次に表になった時スムーズに出現させる
                    smoothedData = { x: null, y: null, angle: null, tilt: null, size: null };
                }

            } else {
                if (isHandPresent) {
                    isHandPresent = false;
                    updateStatus("手を探しています...", false);
                    smoothedData = { x: null, y: null, angle: null, tilt: null, size: null };
                }
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'environment' // 外カメラをデフォルトに
        });

        camera.start()
            .then(() => {
                updateStatus("カメラ起動成功。手をかざしてください。", false);
            })
            .catch(err => {
                updateStatus("カメラへのアクセスが拒否されました", false);
                console.error(err);
            });
    </script>
</body>
</html>
