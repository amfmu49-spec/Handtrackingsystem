<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Error 153を回避するためのリファラーポリシー -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>AR Hand Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Inter', sans-serif; }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        .glass-modal { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; 
            background: #6366f1; cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); 
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #6366f1; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }

        #yt_wrapper {
            position: absolute;
            left: 0;
            top: 0;
            width: 640px;
            height: 360px;
            /* 基準点を【右端・中央】にするためのオフセット */
            /* 指先が右端に来るようにするため、自身の幅分(640px)左にズラす */
            margin-left: -640px;
            margin-top: -180px;
            transform-origin: right center;
            pointer-events: none; 
            opacity: 0; 
            z-index: 5; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backface-visibility: hidden;
            will-change: transform, opacity;
            transition: opacity 0.3s ease;
        }
        #youtube_player { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body class="relative w-full h-screen flex justify-center items-center">

    <!-- カメラ映像表示用 (非表示) -->
    <video id="input_video" class="hidden" autoplay playsinline></video>
    
    <!-- AR描画用キャンバス -->
    <canvas id="output_canvas" class="layer"></canvas>

    <!-- YouTube ホログラム用 DOMラッパー -->
    <div id="yt_wrapper">
        <!-- Error 153回避のため、最初からiframeとして定義しreferrerpolicyを付与 -->
        <iframe id="youtube_player" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <!-- UI レイヤー -->
    <div id="ui_layer" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none" style="z-index: 10;">
        <div class="glass-panel text-white px-4 py-3 rounded-2xl flex flex-col pointer-events-auto shadow-lg shadow-black/50">
            <h1 class="text-sm font-bold tracking-wider flex items-center gap-2">
                AR HAND TRACKER
                <span class="text-[10px] bg-indigo-500 px-2 py-0.5 rounded-full shadow-lg shadow-indigo-500/30">ver.3.2.0</span>
            </h1>
            <div id="status_message" class="text-xs text-gray-300 mt-2 flex items-center gap-2 transition-opacity duration-300">
                <div id="loading_spinner" class="spinner"></div>
                <span id="status_text">AIモデルを読み込み中...</span>
            </div>
        </div>
    </div>

    <div id="settings_trigger" class="absolute inset-0 cursor-pointer" style="z-index: 2;"></div>

    <!-- 設定モーダル -->
    <div id="settings_modal" class="hidden absolute inset-0 bg-black/70 flex justify-center items-center backdrop-blur-sm transition-opacity duration-300" style="z-index: 50;">
        <div class="glass-modal text-white p-6 rounded-3xl w-11/12 max-w-sm flex flex-col gap-4 transform transition-transform duration-300 scale-95" id="settings_content">
            <div class="flex justify-between items-center pb-2">
                <h2 class="text-lg font-bold">ホログラム設定</h2>
                <button id="close_modal_btn" class="text-gray-400 hover:text-white p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex border-b border-gray-700 mb-2">
                <button id="tab_image" class="flex-1 py-2 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400 transition-colors">画像</button>
                <button id="tab_youtube" class="flex-1 py-2 text-sm font-bold border-b-2 border-transparent text-gray-400 transition-colors">YouTube</button>
            </div>

            <div id="content_image" class="flex flex-col gap-2">
                <label class="text-sm text-gray-300 font-semibold">画像をアップロード</label>
                <label for="image_upload" class="flex items-center justify-center w-full p-4 border-2 border-dashed border-gray-600 rounded-xl hover:border-indigo-500 hover:bg-indigo-500/10 cursor-pointer transition-colors">
                    <span id="upload_label" class="text-sm text-gray-400 text-center">タップして画像を選択<br>(PNG, JPG, GIF)</span>
                    <input type="file" id="image_upload" class="hidden" accept="image/png, image/jpeg, image/gif">
                </label>
            </div>

            <div id="content_youtube" class="hidden flex flex-col gap-3">
                <label class="text-sm text-gray-300 font-semibold">YouTubeを検索・再生</label>
                <div class="flex flex-col gap-2">
                    <input type="text" id="youtube_url" placeholder="検索キーワード または URLを入力" class="w-full bg-gray-800 text-white border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    <button id="youtube_set_btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors shadow-lg flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        検索してトップ動画を設定
                    </button>
                </div>
                <p class="text-[10px] text-gray-400 mt-1">手を横（水平）にして指先を伸ばすと、動画が腕のラインに沿って展開されます。</p>
            </div>

            <hr class="border-gray-700 my-1">

            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm text-gray-300 font-semibold">表示サイズ</label>
                    <span id="scale_val" class="text-xs text-indigo-400">100%</span>
                </div>
                <input type="range" id="scale_slider" min="0.2" max="3" step="0.1" value="1">
            </div>

            <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm text-gray-300 font-semibold">3D立体感（立ち上がり）</label>
                    <span id="tilt_val" class="text-xs text-indigo-400">60%</span>
                </div>
                <input type="range" id="tilt_slider" min="0" max="1" step="0.1" value="0.6">
            </div>
        </div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const ctx = canvasElement.getContext('2d');
        const statusMessage = document.getElementById('status_message');
        const statusText = document.getElementById('status_text');
        const loadingSpinner = document.getElementById('loading_spinner');

        const settingsTrigger = document.getElementById('settings_trigger');
        const settingsModal = document.getElementById('settings_modal');
        const closeModalBtn = document.getElementById('close_modal_btn');
        const imageUpload = document.getElementById('image_upload');
        const uploadLabel = document.getElementById('upload_label');
        const scaleSlider = document.getElementById('scale_slider');
        const scaleVal = document.getElementById('scale_val');
        const tiltSlider = document.getElementById('tilt_slider');
        const tiltVal = document.getElementById('tilt_val');

        const tabImage = document.getElementById('tab_image');
        const tabYoutube = document.getElementById('tab_youtube');
        const contentImage = document.getElementById('content_image');
        const contentYoutube = document.getElementById('content_youtube');
        const ytUrlInput = document.getElementById('youtube_url');
        const ytSetBtn = document.getElementById('youtube_set_btn');
        const ytWrapper = document.getElementById('yt_wrapper');

        let loadedImage = null;
        let customScale = 1.0;
        let customTiltAmount = 0.6; 
        let isHandPresent = false;
        let wasHandPresent = false; 
        let smoothedData = { x: null, y: null, angle: null, tilt: null, size: null };
        let activeTab = 'image'; 

        let player;
        let isYtReady = false;

        function onYouTubeIframeAPIReady() {
            // Error 153回避のため、Originを柔軟に設定
            const safeOrigin = (window.location.origin && window.location.origin !== "null") ? window.location.origin : "*";

            player = new YT.Player('youtube_player', {
                videoId: '',
                playerVars: {
                    'playsinline': 1,
                    'controls': 0, 
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'autoplay': 0,
                    'origin': safeOrigin, 
                    'widget_referrer': safeOrigin,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': (event) => { 
                        isYtReady = true; 
                        console.log("YouTube Ready"); 
                        // 自動再生ブロック回避のためミュート（手が映ったら解除する）
                        event.target.mute(); 
                    },
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.PLAYING && !isHandPresent) {
                            player.pauseVideo();
                        }
                    },
                    'onError': (event) => {
                        console.error("YouTube Error:", event.data);
                        let errorMsg = "再生できません";
                        if (event.data === 101 || event.data === 150) errorMsg = "外部サイトでの再生が禁止されています";
                        else if (event.data === 2) errorMsg = "無効なURLまたは検索です";
                        else if (event.data === 153) errorMsg = "セキュリティ制限(Error 153)です";
                        
                        ytSetBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span class="text-xs">${errorMsg}</span>`;
                        ytSetBtn.classList.replace('bg-indigo-600', 'bg-red-600');
                        
                        setTimeout(() => {
                            ytSetBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> 検索してトップ動画を設定';
                            ytSetBtn.classList.replace('bg-red-600', 'bg-indigo-600');
                        }, 4000);
                    }
                }
            });
        }

        function extractVideoID(url) {
            const regExp = /^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        ytSetBtn.addEventListener('click', () => {
            const inputVal = ytUrlInput.value.trim();
            if (!inputVal) return;

            if (isYtReady) {
                const id = extractVideoID(inputVal);
                if (id) {
                    player.loadVideoById(id);
                } else {
                    player.loadPlaylist({ list: inputVal, listType: 'search', index: 0 });
                }
                
                setTimeout(() => { if (typeof player.pauseVideo === 'function') player.pauseVideo(); }, 100);
                
                ytSetBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 準備完了！';
                ytSetBtn.classList.replace('bg-indigo-600', 'bg-green-600');
                
                setTimeout(() => {
                    ytSetBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> 検索してトップ動画を設定';
                    ytSetBtn.classList.replace('bg-green-600', 'bg-indigo-600');
                }, 2000);
            }
        });

        function switchTab(target) {
            activeTab = target;
            if (target === 'image') {
                tabImage.classList.replace('border-transparent', 'border-indigo-500');
                tabImage.classList.replace('text-gray-400', 'text-indigo-400');
                tabYoutube.classList.replace('border-indigo-500', 'border-transparent');
                tabYoutube.classList.replace('text-indigo-400', 'text-gray-400');
                contentImage.classList.remove('hidden');
                contentYoutube.classList.add('hidden');
                
                ytWrapper.style.opacity = '0';
                if (isYtReady && typeof player.pauseVideo === 'function') player.pauseVideo();
            } else {
                tabYoutube.classList.replace('border-transparent', 'border-indigo-500');
                tabYoutube.classList.replace('text-gray-400', 'text-indigo-400');
                tabImage.classList.replace('border-indigo-500', 'border-transparent');
                tabImage.classList.replace('text-indigo-400', 'text-gray-400');
                contentYoutube.classList.remove('hidden');
                contentImage.classList.add('hidden');
            }
        }
        tabImage.addEventListener('click', () => switchTab('image'));
        tabYoutube.addEventListener('click', () => switchTab('youtube'));

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateStatus(message, showSpinner = false) {
            statusText.textContent = message;
            loadingSpinner.style.display = showSpinner ? 'block' : 'none';
            statusMessage.style.opacity = '1';
        }

        settingsTrigger.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            setTimeout(() => document.getElementById('settings_content').classList.remove('scale-95'), 10);
            // 音声再生のユーザーインタラクション制限を解除するフック
            if (isYtReady && activeTab === 'youtube') {
                player.unMute();
            }
        });
        
        function closeModal() {
            document.getElementById('settings_content').classList.add('scale-95');
            setTimeout(() => settingsModal.classList.add('hidden'), 300);
        }
        closeModalBtn.addEventListener('click', closeModal);
        settingsModal.addEventListener('click', (e) => {
            if(e.target === settingsModal) closeModal();
        });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedImage = img;
                        uploadLabel.innerHTML = `<span class="text-indigo-400 font-bold">${file.name}</span><br>設定完了`;
                        uploadLabel.parentElement.classList.add('border-indigo-500', 'bg-indigo-500/10');
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        scaleSlider.addEventListener('input', (e) => { customScale = parseFloat(e.target.value); scaleVal.textContent = Math.round(customScale * 100) + '%'; });
        tiltSlider.addEventListener('input', (e) => { customTiltAmount = parseFloat(e.target.value); tiltVal.textContent = Math.round(customTiltAmount * 100) + '%'; });

        function lerp(start, end, factor) { return start + (end - start) * factor; }
        function lerpAngle(start, end, factor) {
            let diff = end - start;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return start + diff * factor;
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 0, 
            minDetectionConfidence: 0.4, 
            minTrackingConfidence: 0.4 
        });

        hands.onResults((results) => {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
            
            if (hasHand && !wasHandPresent) {
                isHandPresent = true;
                if (activeTab === 'youtube' && isYtReady && typeof player.playVideo === 'function') {
                    player.playVideo();
                }
            } else if (!hasHand && wasHandPresent) {
                isHandPresent = false;
                if (isYtReady && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
                ytWrapper.style.opacity = '0';
                smoothedData = { x: null, y: null, angle: null, tilt: null, size: null };
            }
            wasHandPresent = hasHand;

            if (hasHand) {
                statusMessage.style.opacity = '0';
                const landmarks = results.multiHandLandmarks[0];
                const handedness = results.multiHandedness[0];
                const p0 = landmarks[0]; 
                const p5 = landmarks[5]; 
                const p9 = landmarks[9]; 
                const p12 = landmarks[12]; // 中指の先端
                const p17 = landmarks[17];
                const aspect = canvasElement.width / canvasElement.height;

                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: '#06b6d4', lineWidth: 3 });
                drawLandmarks(ctx, landmarks, { color: '#a855f7', fillColor: '#ffffff', lineWidth: 2, radius: (data) => [4, 8, 12, 16, 20].includes(data.index) ? 5 : 3 });

                const palmCenterX = (p0.x + p9.x) / 2 * canvasElement.width;
                const palmCenterY = (p0.y + p9.y) / 2 * canvasElement.height;

                const rawSize = Math.hypot(
                    (p9.x - p0.x) * canvasElement.width, 
                    (p9.y - p0.y) * canvasElement.height, 
                    (p9.z - p0.z) * canvasElement.width
                ) * 2.0;

                let nx = ((p5.y-p0.y)/aspect * (p17.z-p0.z)) - ((p5.z-p0.z) * (p17.y-p0.y)/aspect);
                let ny = ((p5.z-p0.z) * (p17.x-p0.x)) - ((p5.x-p0.x) * (p17.z-p0.z));
                let nz = ((p5.x-p0.x) * (p17.y-p0.y)/aspect) - ((p5.y-p0.y)/aspect * (p17.x-p0.x));
                
                if (handedness.label === 'Left') { nx = -nx; ny = -ny; nz = -nz; }
                
                const normalLen2D = Math.hypot(nx, ny);
                const normalLen = Math.hypot(nx, ny, nz);
                
                // 欠落していたrawTilt（潰れ度合い）の計算式を修正
                const physicalTilt = normalLen2D / (normalLen || 1);
                const rawTilt = Math.max(0.2, physicalTilt); // 潰れすぎ防止(最低0.2)
                
                const targetTilt = lerp(1.0, rawTilt, customTiltAmount);

                let finalTargetAngle = Math.atan2(p9.y - p0.y, (p9.x - p0.x)*aspect) + Math.PI/2;
                let targetX = palmCenterX;
                let targetY = palmCenterY;

                if (activeTab === 'youtube') {
                    // YouTubeモード: 腕の方向(手首→中指)と平行になるように角度を設定
                    finalTargetAngle = Math.atan2(p12.y - p0.y, (p12.x - p0.x)*aspect);
                    // アンカーポイント(右端)を指先(p12)に設定
                    targetX = p12.x * canvasElement.width;
                    targetY = p12.y * canvasElement.height;

                    // 再生開始時に自動的にミュートを解除
                    if (isYtReady && typeof player.unMute === 'function') {
                        player.unMute();
                        player.setVolume(100);
                    }
                }

                const smoothPos = 0.7;
                const smoothAngle = 0.4;
                const smoothScale = 0.3;

                if (smoothedData.x === null) {
                    smoothedData = { x: targetX, y: targetY, angle: finalTargetAngle, tilt: targetTilt, size: rawSize };
                } else {
                    smoothedData.x = lerp(smoothedData.x, targetX, smoothPos);
                    smoothedData.y = lerp(smoothedData.y, targetY, smoothPos);
                    smoothedData.size = lerp(smoothedData.size, rawSize, smoothScale);
                    smoothedData.tilt = lerp(smoothedData.tilt, targetTilt, smoothScale);
                    smoothedData.angle = lerpAngle(smoothedData.angle, finalTargetAngle, smoothAngle);
                }

                if (activeTab === 'image' && loadedImage) {
                    ctx.save();
                    ctx.translate(smoothedData.x, smoothedData.y);
                    ctx.rotate(smoothedData.angle);
                    ctx.scale(1, smoothedData.tilt);
                    const imgWidth = smoothedData.size * customScale;
                    const imgHeight = (loadedImage.height / loadedImage.width) * imgWidth;
                    ctx.drawImage(loadedImage, -imgWidth / 2, -imgHeight, imgWidth, imgHeight);
                    ctx.restore();
                } 
                else if (activeTab === 'youtube' && isYtReady) {
                    ytWrapper.style.opacity = '1';
                    const targetScale = (smoothedData.size * customScale * 2.0) / 640;
                    
                    // DOMを3D変形 (基準点は右端・中央)
                    ytWrapper.style.transform = `
                        translate(${smoothedData.x}px, ${smoothedData.y}px) 
                        rotate(${smoothedData.angle}rad) 
                        scaleY(${smoothedData.tilt}) 
                        scale(${targetScale})
                    `;
                }

            } else {
                updateStatus("手を探しています...", false);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720, facingMode: 'environment'
        });
        
        camera.start()
            .then(() => updateStatus("カメラ起動完了", false))
            .catch(err => { updateStatus("カメラエラー", false); console.error(err); });
    </script>
</body>
</html>
