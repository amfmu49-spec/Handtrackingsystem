<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Hand Tracker (完全版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- YouTubeエラー回避 -->
    <meta name="referrer" content="no-referrer">
    
    <style>
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            /* アウトカメラ使用のため、映像の左右反転(scaleX)は行いません */
        }
        
        #yt_container {
            position: absolute;
            z-index: 10;
            width: 320px;
            height: 180px;
            /* 基準点を「右端・中央」に設定 (指先に動画の端を合わせるため) */
            transform-origin: right center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            background: #000;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }
        
        /* 美しいガラスモーフィングデザイン */
        .glass { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            outline: none;
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen w-screen relative overflow-hidden bg-black text-white">

    <!-- バージョン情報 -->
    <div class="absolute top-4 left-4 z-40 bg-black/40 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl shadow-lg pointer-events-none">
        <h1 class="text-sm font-bold tracking-widest text-white/90 flex items-center gap-2">
            AR HAND TRACKER
            <span class="bg-blue-600/80 text-white text-[10px] px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(37,99,235,0.8)]">v3.5.0</span>
        </h1>
    </div>

    <!-- ヒント -->
    <div id="hint_text" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-20 text-white/50 text-sm font-bold pointer-events-none transition-opacity">
        画面をタップして設定を開く
    </div>

    <!-- カメラ映像（非表示）と描画用Canvas -->
    <video id="input_video" class="hidden" autoplay playsinline></video>
    <canvas id="output_canvas" class="absolute inset-0 z-0"></canvas>

    <!-- YouTube動画コンテナ -->
    <div id="yt_container">
        <iframe id="yt_iframe" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&enablejsapi=1" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

    <!-- 画面タップ判定用レイヤー (モーダル起動用) -->
    <div id="tap_layer" class="absolute inset-0 z-10"></div>

    <!-- 設定モーダル（ガラスモーフィング） -->
    <div id="settings_modal" class="hidden absolute inset-0 z-50 bg-black/60 flex justify-center items-center backdrop-blur-sm transition-all duration-300">
        <div class="glass text-white p-8 rounded-3xl w-11/12 max-w-sm relative overflow-hidden shadow-2xl">
            <!-- 装飾用の光彩エフェクト -->
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-500 rounded-full mix-blend-screen filter blur-[40px] opacity-50 pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-purple-500 rounded-full mix-blend-screen filter blur-[40px] opacity-50 pointer-events-none"></div>

            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3 relative z-10 tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-blue-400 drop-shadow-lg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                </svg>
                SETTINGS
            </h2>
            
            <div class="mb-5 relative z-10">
                <label class="block text-xs font-medium text-gray-300 mb-2 tracking-widest">YOUTUBE URL</label>
                <input type="text" id="youtube_url" placeholder="URLをペースト" class="glass-input w-full p-4 rounded-xl text-sm transition-all duration-300">
            </div>

            <div class="mb-8 relative z-10">
                <label class="block text-xs font-medium text-gray-300 mb-3 flex justify-between tracking-widest">
                    <span>SIZE</span>
                    <span id="size_value" class="text-blue-300 font-bold">100%</span>
                </label>
                <input type="range" id="size_slider" min="0.5" max="2.5" step="0.1" value="1.0" class="w-full accent-blue-500 h-2 bg-gray-700/50 rounded-lg appearance-none cursor-pointer">
            </div>

            <div class="relative z-10 space-y-3">
                <button id="set_btn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 py-3.5 rounded-xl font-bold text-white transition-all shadow-[0_0_20px_rgba(79,70,229,0.5)] transform hover:scale-[1.02]">
                    設定を適用
                </button>
                <button id="close_btn" class="w-full bg-white/10 hover:bg-white/20 text-gray-200 hover:text-white py-3 rounded-xl transition-all font-medium border border-white/10">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const ytContainer = document.getElementById('yt_container');
        const ytIframe = document.getElementById('yt_iframe');
        
        const tapLayer = document.getElementById('tap_layer');
        const settingsModal = document.getElementById('settings_modal');
        const hintText = document.getElementById('hint_text');
        const closeBtn = document.getElementById('close_btn');
        const setBtn = document.getElementById('set_btn');
        const sizeSlider = document.getElementById('size_slider');
        const sizeValue = document.getElementById('size_value');
        const urlInput = document.getElementById('youtube_url');

        let currentScale = 1.0;
        let isProcessing = false; // WASMクラッシュ防止用のロック

        // 画面タップで設定を開く
        tapLayer.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            hintText.classList.add('opacity-0');
            tapLayer.style.pointerEvents = 'none'; // モーダル操作中は裏のタップ判定を無効化
        });

        // 閉じるボタン
        closeBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            tapLayer.style.pointerEvents = 'auto'; // タップ判定を復活
        });

        // スライダー連動
        sizeSlider.addEventListener('input', (e) => {
            currentScale = parseFloat(e.target.value);
            sizeValue.textContent = Math.round(currentScale * 100) + '%';
        });

        // URL適用ボタン
        setBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) {
                let videoId = '';
                const vMatch = url.match(/[?&]v=([^&]+)/);
                const shortMatch = url.match(/youtu\.be\/([^?]+)/);
                const shortsMatch = url.match(/youtube\.com\/shorts\/([^?]+)/);
                
                if (vMatch) videoId = vMatch[1];
                else if (shortMatch) videoId = shortMatch[1];
                else if (shortsMatch) videoId = shortsMatch[1];

                if (videoId) {
                    ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&enablejsapi=1`;
                }
            }
            settingsModal.classList.add('hidden');
            tapLayer.style.pointerEvents = 'auto';
        });

        // キャンバスのリサイズ対応
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function onResults(results) {
            isProcessing = false; // 処理完了、ロック解除
            
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // カメラ映像を描画（アウトカメラなので左右反転しない）
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // 1. 手の骨格（ポインタ）を描画する
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 3});

                // 2. 指先の座標を取得（中指の先端 = index: 12）
                const middleFingerTip = landmarks[12];
                // 手首 (0) と 中指の付け根 (9) から角度と奥行きを計算
                const wrist = landmarks[0];
                const middleFingerBase = landmarks[9];

                // 画面上のピクセル座標に変換
                const tipX = middleFingerTip.x * canvasElement.width;
                const tipY = middleFingerTip.y * canvasElement.height;

                // 2Dの傾きを計算
                const dx = middleFingerBase.x - wrist.x;
                const dy = middleFingerBase.y - wrist.y;
                const angleRad = Math.atan2(dy, dx);
                let angleDeg = angleRad * (180 / Math.PI);
                
                // カメラの距離（奥行き）からスケールを計算
                const baseDistance = Math.sqrt(dx*dx + dy*dy);
                const depthScale = baseDistance * 10;
                const finalScale = currentScale * depthScale;

                // 3. YouTubeコンテナの位置と角度を適用
                ytContainer.style.opacity = 1;
                // コンテナの右端が tipX, tipY (指先) に来るように translate(-100%, -50%) で調整
                ytContainer.style.transform = `
                    translate(${tipX}px, ${tipY}px) 
                    translate(-100%, -50%) 
                    rotate(${angleDeg}deg) 
                    scale(${finalScale})
                `;
            } else {
                // 手が認識されない場合は非表示
                ytContainer.style.opacity = 0;
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if(isProcessing) return; // ロック中ならスキップ（クラッシュ防止）
                isProcessing = true;
                try {
                    await hands.send({image: videoElement});
                } catch(e) {
                    console.error("MediaPipe Error:", e);
                    isProcessing = false;
                }
            },
            width: 1280,
            height: 720,
            facingMode: 'environment' // アウトカメラに固定
        });

        // AIの準備が完全に整ってからカメラを起動する
        hands.initialize().then(() => {
            camera.start();
        });
    </script>
</body>
</html>
