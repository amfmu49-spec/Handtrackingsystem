<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="referrer" content="origin">
    <title>AR Hand Tracker - YouTube & TikTok</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        #video_container {
            position: relative; width: 100vw; height: 100vh;
        }
        #input_video {
            display: none; 
        }
        #output_canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        
        /* YouTube / TikTok コンテナ（高解像度ベースにして縮小表示する） */
        #yt_container {
            position: absolute; z-index: 10;
            width: 640px; height: 360px; /* デフォルトはYouTubeサイズ */
            transform-origin: center center;
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.2s ease, width 0.3s, height 0.3s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden; background: #000;
        }
        #yt_container iframe {
            width: 100%; height: 100%; border: none;
            pointer-events: auto;
        }

        /* 美しいガラスモーフィングデザイン */
        .glass {
            background: rgba(25, 25, 35, 0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            outline: none;
        }
        .glass-badge {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* ローディングアニメーション */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="video_container">
        <!-- バッジ表示 -->
        <div class="absolute top-4 left-4 z-50 glass-badge text-white px-4 py-2 rounded-full font-bold text-xs tracking-wider shadow-lg">
            AR HAND TRACKER v4.0.0
        </div>
        
        <div class="absolute bottom-8 left-0 right-0 z-50 text-center pointer-events-none text-white text-sm font-medium opacity-80 drop-shadow-lg">
            画面の空いている場所をタップして設定 / 音声ON
        </div>
        
        <video id="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
        
        <!-- ホログラム枠 -->
        <div id="yt_container">
            <iframe id="video_player" src="" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>

    <div id="settings_modal" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center p-4">
        <!-- 背景タップで閉じるためのレイヤー -->
        <div id="modal_backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity"></div>
        
        <div class="glass relative w-full max-w-sm rounded-3xl p-8 flex flex-col gap-6 text-white transform transition-all shadow-2xl">
            <h2 class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
                設定 / Settings
            </h2>
            
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">YouTube / TikTok URL</label>
                <input type="text" id="url_input" placeholder="動画のURLをペースト..." class="glass-input p-4 rounded-xl text-sm w-full transition-all">
                <p class="text-[11px] text-gray-400 mt-1 leading-tight">
                    ※TikTokアプリからの短いURL（vt.tiktok.com等）にも対応しました！自動で読み取ります。
                </p>
            </div>

            <div class="flex flex-col gap-2 mt-2">
                <label class="text-sm font-medium text-gray-300 flex justify-between">
                    <span>ホログラムの基本サイズ</span>
                    <span id="scale_display">15%</span>
                </label>
                <!-- ベース枠が大きくなったため、初期値を小さく（0.15）設定 -->
                <input type="range" id="scale_slider" min="0.05" max="1.0" step="0.05" value="0.15" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <div class="flex flex-col gap-3 mt-2 bg-black/40 p-4 rounded-2xl border border-white/10 shadow-inner">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="depth_mode_cb" class="w-5 h-5 rounded border-gray-600 text-blue-500 focus:ring-blue-500 bg-gray-800">
                    <span class="text-sm font-medium text-gray-200">遠近感モード (手の距離でサイズ変化)</span>
                </label>
            </div>

            <button id="save_btn" class="mt-4 w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.5)] transition-all active:scale-95 flex items-center justify-center">
                <span id="btn_text">適用して閉じる</span>
            </button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const ytContainer = document.getElementById('yt_container');
        const iframePlayer = document.getElementById('video_player');
        
        const settingsModal = document.getElementById('settings_modal');
        const modalBackdrop = document.getElementById('modal_backdrop');
        const urlInput = document.getElementById('url_input');
        const scaleSlider = document.getElementById('scale_slider');
        const scaleDisplay = document.getElementById('scale_display');
        const saveBtn = document.getElementById('save_btn');
        const btnText = document.getElementById('btn_text');
        const depthModeCb = document.getElementById('depth_mode_cb');

        let scaleValue = 0.15; // ベース解像度を上げたため、15%がちょうどいいサイズ感
        let isProcessing = false;
        let isDepthMode = false;
        let hasInteracted = false;
        
        let handPosture = 'horizontal'; // AIによる手の向きの判定

        const initialVideoId = "Q_B299n02qI";
        const originUrl = window.location.origin || 'https://google.com';
        iframePlayer.src = `https://www.youtube.com/embed/${initialVideoId}?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=${initialVideoId}&origin=${originUrl}`;

        // 画面タップで設定を開き、YouTubeのミュートを解除
        canvasElement.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
            
            if (!hasInteracted) {
                hasInteracted = true;
                if (iframePlayer.contentWindow) {
                    iframePlayer.contentWindow.postMessage(JSON.stringify({ "event": "command", "func": "unMute", "args": [] }), "*");
                    iframePlayer.contentWindow.postMessage(JSON.stringify({ "event": "command", "func": "setVolume", "args": [100] }), "*");
                }
            }
        });

        // モーダルの背景タップで閉じる
        modalBackdrop.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
        });

        scaleSlider.addEventListener('input', (e) => {
            scaleValue = parseFloat(e.target.value);
            scaleDisplay.textContent = Math.round(scaleValue * 100) + '%';
        });

        depthModeCb.addEventListener('change', (e) => { isDepthMode = e.target.checked; });

        // 短縮URLを解析してフルURLを取得する裏技的関数（超強化版）
        async function fetchTikTokFullUrl(shortUrl) {
            try {
                // 1. TikTokのoEmbed APIを使って動画IDを取得する（最も成功率が高い）
                const oembedUrl = `https://www.tiktok.com/oembed?url=${shortUrl}`;
                const proxyUrl1 = `https://api.allorigins.win/get?url=${encodeURIComponent(oembedUrl)}`;
                const response1 = await fetch(proxyUrl1);
                const data1 = await response1.json();
                if (data1 && data1.contents) {
                    const oembedData = JSON.parse(data1.contents);
                    const match1 = oembedData.html.match(/data-video-id="(\d+)"/);
                    if (match1 && match1[1]) {
                        return `https://www.tiktok.com/@user/video/${match1[1]}`;
                    }
                }
            } catch (err) {
                console.warn("oEmbed解析失敗, 次のメソッドを試します", err);
            }

            try {
                // 2. HTML本体を取得してメタタグや裏側のデータを探す
                const proxyUrl2 = `https://api.allorigins.win/get?url=${encodeURIComponent(shortUrl)}`;
                const response2 = await fetch(proxyUrl2);
                const data2 = await response2.json();
                
                if (data2 && data2.contents) {
                    // canonical URL (正規のURL)
                    let match = data2.contents.match(/<link[^>]+rel="canonical"[^>]+href="([^"]+)"/);
                    if (match && match[1] && match[1].includes('/video/')) return match[1];
                    
                    // aweme_id (システム上の動画ID) を探す
                    match = data2.contents.match(/"aweme_id":"(\d+)"/);
                    if (match && match[1]) return `https://www.tiktok.com/@user/video/${match[1]}`;
                    
                    // 単純なURLのパターンマッチ
                    match = data2.contents.match(/(https:\/\/(?:www\.)?tiktok\.com\/@[^/]+\/video\/\d+)/);
                    if (match && match[1]) return match[1];
                }
            } catch (err) {
                console.warn("HTML解析失敗:", err);
            }

            return null;
        }

        saveBtn.addEventListener('click', async () => {
            let url = urlInput.value.trim();
            if (!url) {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
                return;
            }

            // 短縮URL（vt.tiktok.com 等）の検出と解析処理
            if (url.includes('vt.tiktok.com') || url.includes('vm.tiktok.com')) {
                btnText.innerHTML = '<span class="loader"></span> 解析中...';
                saveBtn.disabled = true;
                
                const fullUrl = await fetchTikTokFullUrl(url);
                
                saveBtn.disabled = false;
                btnText.innerHTML = '適用して閉じる';

                if (fullUrl) {
                    url = fullUrl; // 取得した長いURLに差し替える
                } else {
                    alert("動画URLの自動解析に失敗しました。お手数ですが、ブラウザで動画を開き、アドレスバーの長いURLをコピーしてください。");
                    return;
                }
            }

            const ytRegExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const ttRegExp = /(?:video|v)\/(\d{15,})/;
            
            const ytMatch = url.match(ytRegExp);
            const ttMatch = url.match(ttRegExp);

            if (ytMatch && ytMatch[2].length === 11) {
                const videoId = ytMatch[2];
                iframePlayer.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1&mute=0&loop=1&playlist=${videoId}&origin=${originUrl}`;
                // 高解像度ベース（16:9）
                ytContainer.style.width = '640px';
                ytContainer.style.height = '360px';
            } else if (ttMatch && ttMatch[1]) {
                const videoId = ttMatch[1];
                iframePlayer.src = `https://www.tiktok.com/embed/v2/${videoId}`;
                // クロップを防ぐための高解像度縦長ベース（9:16）
                ytContainer.style.width = '360px';
                ytContainer.style.height = '640px';
            } else {
                alert("未対応のURLです。正しい動画リンクを入力してください。");
                return; 
            }
            
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
        });

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            // 現実のカメラ映像を描画
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height); 

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 骨組みの描画
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#FF3B30', lineWidth: 4}); 
                drawLandmarks(canvasCtx, landmarks, {color: '#34C759', lineWidth: 2, radius: 4}); 

                const wrist = landmarks[0];
                const middleFingerMCP = landmarks[9];
                
                // 位置の計算（手のひらの中央）
                const palmX = (wrist.x + middleFingerMCP.x) / 2;
                const palmY = (wrist.y + middleFingerMCP.y) / 2;
                const pixelX = palmX * canvasElement.width;
                const pixelY = palmY * canvasElement.height;

                // dx, dy (0〜1の正規化された値)
                const dx = middleFingerMCP.x - wrist.x;
                const dy = middleFingerMCP.y - wrist.y;
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                let absAngle = Math.abs(angle);

                // --- 手の向き判定（縦か横か） ---
                if (handPosture === 'horizontal') {
                    if (absAngle > 60 && absAngle < 120) handPosture = 'vertical';
                } else {
                    if (absAngle < 40 || absAngle > 140) handPosture = 'horizontal';
                }

                // デフォルトは指先が「右」。縦持ちと判定された場合は指先を「上」にする
                let finalAngle = angle;
                if (handPosture === 'vertical') {
                    finalAngle += 90; 
                }

                // --- 遠近感モードの修正 ---
                let finalScale = scaleValue;
                if (isDepthMode) {
                    // 手の大きさ（画面の比率 0〜1）を使って計算するため、画面解像度に依存しない
                    const handSize = Math.sqrt(dx * dx + dy * dy); 
                    const baseHandSize = 0.15; // 手が画面の15%ほどの大きさを基準とする
                    finalScale = scaleValue * (handSize / baseHandSize);
                }

                ytContainer.style.left = `${pixelX}px`;
                ytContainer.style.top = `${pixelY}px`;
                ytContainer.style.transform = `translate(-50%, -50%) scale(${finalScale}) rotate(${finalAngle}deg)`;
                ytContainer.style.opacity = 1;

            } else {
                ytContainer.style.opacity = 0;
            }
            
            canvasCtx.restore();
            isProcessing = false;
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                if (isProcessing) return;
                isProcessing = true;
                try {
                    await hands.send({image: videoElement});
                } catch (error) {
                    console.error("MediaPipe Error:", error);
                    isProcessing = false;
                }
            },
            width: 1280,
            height: 720,
            facingMode: 'environment' // アウトカメラ
        });

        hands.initialize().then(() => {
            camera.start().catch(err => {
                console.error("Camera access failed:", err);
                alert("カメラへのアクセスが拒否されたか、利用できません。");
            });
        });
    </script>
</body>
</html>
